<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">⚓</div><div><b>BLUE HORIZON</b><small>SHIPPING COMPANY SIMULATOR</small></div></div>
  <div class="stats">
    <div class="stat"><label>Kontostand</label><strong class="money" id="cash">€ 2.500.000</strong></div>
    <div class="stat"><label>Flotte</label><strong id="fleetCount">3 Schiffe</strong></div>
    <div class="stat"><label>Spieltag</label><strong id="dayCount">Tag 1</strong></div>
    <div class="stat"><label>Reputation</label><strong id="rep">⭐ 50</strong></div>
  </div>
  <div class="top-actions"><button class="hide-mobile" onclick="openMarket()">⚓ Werft</button><div class="speed-controls"><button id="pauseBtn" onclick="setSpeed(0)">Ⅱ Pause</button><button id="playBtn" class="active" onclick="setSpeed(1)">▶ Play</button><button id="fastBtn" title="1,5-fache Geschwindigkeit" aria-label="1,5-fache Geschwindigkeit" onclick="setSpeed(1.5)">⏩</button></div></div>
</header>
<main class="main">
 <div class="map-wrap"><div id="map"></div></div>
 <div class="map-head"><div class="map-title"><strong>🌍 WELTWEITER BETRIEB</strong><p>Satellitenansicht · zoomen & Karte ziehen</p></div><div class="map-actions"><button onclick="map.setView([20,5],2)">🌐 Welt</button><button onclick="map.setView([53.5,5],5)">🇪🇺 Europa</button><button onclick="toggleLabels()">⚑ Häfen</button></div></div>
 <section class="side" id="side">
  <div class="panel fleet-panel">
   <div class="panel-head"><h2>🚢 Deine Flotte</h2><span class="pill" id="fleetBadge">3 Schiffe</span></div>
   <div class="panel-body"><div class="ship-list" id="shipList"></div></div>
  </div>
  <div class="panel route-panel">
   <div class="panel-head"><h2>🧭 Route planen</h2><div class="mobile-tabs"><button onclick="showFleet()">Flotte</button><button onclick="showRoutes()">Route</button></div></div>
   <div class="panel-body">
    <div class="field"><label>Schiff auswählen</label><select id="shipSelect" onchange="selectShip(this.value)"></select></div>
    <div class="field"><label>Firmenauftrag</label><select id="contractSelect" onchange="chooseContract()"></select></div><div class="field"><label>Frachtart (passend zum Schiff)</label><select id="cargoSelect" onchange="updateEstimate()"></select></div>
    <div class="field"><label>Abfahrtshafen</label><select id="fromSelect" onchange="updateEstimate()"></select></div>
    <div class="field"><label>Zielhafen</label><select id="toSelect" onchange="updateEstimate()"></select></div>
    <div class="route-info" id="routeInfo">Wähle Schiff, Fracht und zwei Häfen.</div>
    <button class="primary full" id="startRoute" onclick="startRoute()">Route beauftragen</button>
   </div>
  </div>
 </section>
 <div class="bottom-left panel">
  <div class="panel-head"><h2>📡 Leitstand</h2><div class="daybar"><span class="muted" id="dateLabel">Jahr 1 · Tag 1</span><button class="small" onclick="openFinance()">€ Finanzen</button></div></div>
  <div class="panel-body"><div class="log" id="log"></div></div>
 </div>
 <div class="toast" id="toast"></div>
 <div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Werft</h2><button onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div></div></div>
</main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

renderMapShips=function(){_oldRenderMapShips();if(!map)return;const z=map.getZoom();const size=Math.max(13,Math.min(24,24-(z-2)*.7));document.querySelectorAll('.ship-icon').forEach(el=>{el.style.width=size+'px';el.style.height=(size*.55)+'px';el.style.marginLeft=(-size/2)+'px';el.style.marginTop=(-size*.275)+'px';});};
const _oldStartRoute=startRoute;
startRoute=function(contractId){if(contractId){const s=state.ships.find(x=>x.id===state.selected),contract=contracts.find(c=>c.id===contractId);if(!s||!contract||s.trip||!type(s.type).allowed.includes(contract.cargo)){toast('Auftrag passt nicht zu diesem Schiff oder Schiff ist unterwegs.');return} $('fromSelect').value=contract.from;$('toSelect').value=contract.to;refreshCargoOptions();$('cargoSelect').value=contract.cargo;updateEstimate();}return _oldStartRoute();};
openContracts=function(shipId){
 const s=state.ships.find(x=>x.id===shipId);if(!s)return;
 const available=contracts.filter(c=>type(s.type).allowed.includes(c.cargo)&&c.from!==c.to);
 const panel=document.querySelector('.route-panel')||document.querySelector('.route-planner')||document.querySelector('#routeInfo')?.closest('.panel');
 const target=panel||document.querySelector('#side');
 if(!target)return;
 target.dataset.originalHtml=target.dataset.originalHtml||target.innerHTML;
 target.innerHTML='<div class="panel-head"><h2>🏢 Firmenaufträge</h2><button class="small" onclick="restoreRoutePlanner()">↩ Routenplanung</button></div><div class="panel-body"><p class="muted">Aufträge für '+s.name+' · '+type(s.type).name+'</p>'+(s.trip?'<div class="contract-card">Dieses Schiff ist unterwegs. Nach der Ankunft kannst du einen neuen Auftrag wählen.</div>':available.map(c=>'<div class="contract-card"><h3>'+c.company+'</h3><p>'+c.desc+'</p><p>🧭 '+port(c.from).name+' → '+port(c.to).name+'<br>📦 '+cargo(c.cargo).icon+' '+cargo(c.cargo).name+'<br>⏳ '+c.deadline+' Spieltage</p><div class="price">Bonus '+fmt(c.bonus)+'</div><button class="primary full" onclick="acceptInlineOrder(\''+s.id+'\',\''+c.id+'\')">Auftrag übernehmen</button></div>').join(''))+'<div class="coming-soon"><strong>🚢 Passagierbeförderung — COMING SOON</strong></div></div>';
 window.activeOrdersPanel=target;
};
function restoreRoutePlanner(){const p=window.activeOrdersPanel;if(p&&p.dataset.originalHtml){p.innerHTML=p.dataset.originalHtml;delete p.dataset.originalHtml;window.activeOrdersPanel=null;fillSelects();updateEstimate();}}
function acceptInlineOrder(shipId,contractId){const s=state.ships.find(x=>x.id===shipId),c=contracts.find(x=>x.id===contractId);if(!s||!c||s.trip||!type(s.type).allowed.includes(c.cargo)){toast('Auftrag ist nicht verfügbar.');return}state.selected=s.id;$('shipSelect').value=s.id;$('fromSelect').value=c.from;$('toSelect').value=c.to;refreshCargoOptions();$('cargoSelect').value=c.cargo;restoreRoutePlanner();updateEstimate();startRoute(c.id);}

</script>
</body>
